services:
  backend:
    build: backend
    container_name: transcendence-backend
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "3000:3000" #dev env, delete when prod
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 2 #change back to 10 later
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SECRET_JWT_KEY: ${SECRET_JWT_KEY}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./shared/:/app/src/shared/
      - ./backend/app/src:/app/src #dev env, change when prod
    networks:
      - localnet_transcendence

  postgres:
    image: postgres:15
    container_name: transcendence-pg-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    env_file: ".env"
    ports:
      - "5432:5432"
    volumes:
      - pgdata_transcendence:/var/lib/postgresql/data
    networks:
      - localnet_transcendence

  game_data:
    build:
      context: game_data
    container_name: transcendence-game-data
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./shared/:/opt/game_data/shared/
    networks:
      - localnet_transcendence

  web:
    build: web
    container_name: transcendence-web
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - localnet_transcendence

  proxy:
    build: proxy
    container_name: transcendence-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - localnet_transcendence
  
  prometheus:
    image: prom/prometheus:latest
    container_name: transcendence-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_transcendence:/prometheus
    expose:
      - "9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.external-url=https://localhost:8443/prometheus/'
      - '--web.route-prefix=/prometheus/'
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - localnet_transcendence

volumes:
  pgdata_transcendence:
  prometheus_transcendence:
  grafana_transcendence:

networks:
  localnet_transcendence:
    driver: bridge
