services:
  postgres:
    image: postgres:15
    container_name: transcendance-pg-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_transcendance:/var/lib/postgresql/data
    networks:
      - localnet_transcendance

  web:
    build: web
    container_name: transcendance-web
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - localnet_transcendance

  proxy:
    build: proxy
    container_name: transcendance-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - localnet_transcendance

volumes:
  pgdata_transcendance:

networks:
  localnet_transcendance:
    driver: bridge