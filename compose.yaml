services:
  backend:
    build: backend
    container_name: transcendence-backend
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HOST_IP: ${HOST_IP}
      DEBUG: ${DEBUG}
      CONTAINER_NAME: backend
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: ${DATABASE_URL}
      SECRET_JWT_KEY: ${SECRET_JWT_KEY}
      RIOT_API_KEY: ${RIOT_API_KEY}
      FORTYTWO_CLIENT_ID: ${FORTYTWO_CLIENT_ID}
      FORTYTWO_CLIENT_SECRET: ${FORTYTWO_CLIENT_SECRET}
      FORTYTWO_REDIRECT_URI: ${FORTYTWO_REDIRECT_URI}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./shared/:/app/src/shared/
    networks:
      - localnet_transcendence

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: transcendence-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - localnet_transcendence

  postgres:
    image: postgres:15
    container_name: transcendence-pg-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 2
    env_file: ".env"
    volumes:
      - pgdata_transcendence:/var/lib/postgresql/data
    networks:
      - localnet_transcendence

  game_data:
    build:
      context: game_data
    container_name: transcendence-game-data
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      CONTAINER_NAME: game_data
      HOST_IP: ${HOST_IP}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: ${DATABASE_URL}
      SECRET_JWT_KEY: ${SECRET_JWT_KEY}
      RIOT_API_KEY: ${RIOT_API_KEY}
      FORTYTWO_CLIENT_ID: ${FORTYTWO_CLIENT_ID}
      FORTYTWO_CLIENT_SECRET: ${FORTYTWO_CLIENT_SECRET}
      FORTYTWO_REDIRECT_URI: ${FORTYTWO_REDIRECT_URI}
    volumes:
      - ./shared/:/opt/game_data/shared/
    networks:
      - localnet_transcendence

  web:
    build: web
    container_name: transcendence-web
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - localnet_transcendence

  proxy:
    build: proxy
    container_name: transcendence-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      PROMETHEUS_ADMIN_USER: ${PROMETHEUS_ADMIN_USER}
      PROMETHEUS_ADMIN_PASSWORD: ${PROMETHEUS_ADMIN_PASSWORD}
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - localnet_transcendence
  
  prometheus:
    image: prom/prometheus:latest
    container_name: transcendence-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_transcendence:/prometheus
    expose:
      - "9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.external-url=https://localhost:8443/prometheus/'
      - '--web.route-prefix=/prometheus/'
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - localnet_transcendence
    
  alertmanager:
    image: prom/alertmanager:latest
    container_name: transcendence-alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    expose:
      - "9093"
    networks:
      - localnet_transcendence
    
  grafana:
    image: grafana/grafana:latest
    container_name: transcendence-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "https://localhost:8443/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_transcendence:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - "3000"
    depends_on:
      - prometheus
    networks:
      - localnet_transcendence
    
  node-exporter:
    image: prom/node-exporter:latest
    container_name: transcendence-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - "9100"
    networks:
      - localnet_transcendence

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: transcendence-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - localnet_transcendence

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: transcendence-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "9187"
    networks:
      - localnet_transcendence

volumes:
  pgdata_transcendence:
  prometheus_transcendence:
  grafana_transcendence:
  ollama_data:

networks:
  localnet_transcendence:
    driver: bridge
