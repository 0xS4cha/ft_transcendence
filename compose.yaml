services:
  backend:
    build: backend
    container_name: transcendence-backend
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - localnet_transcendence

  postgres:
    image: postgres:15
    container_name: transcendence-pg-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_transcendence:/var/lib/postgresql/data
    networks:
      - localnet_transcendence

  web:
    build: web
    container_name: transcendence-web
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - localnet_transcendence

  proxy:
    build: proxy
    container_name: transcendence-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - localnet_transcendence

volumes:
  pgdata_transcendence:

networks:
  localnet_transcendence:
    driver: bridge
